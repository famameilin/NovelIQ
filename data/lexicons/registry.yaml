# 词表注册中心 (Lexicon Registry)
#
# 定义所有词表的分层归属与元信息。
# 每个 entry 对应 data/lexicons/ 下的一个 .txt 文件。
# 新增词表必须在此注册，否则不会被加载器识别。
#
# 创建时间: 2026-04-06 | 分支: fix/timeline-multi-peak

version: "2.0"

layers:
  emotion:
    description: "情感极性词表，用于 lexical_sentiment_density"
    lexicons:
      positive:
        file: "positive.txt"
        count: 1061
        usage: ["emotion_curve", "tension_composite"]
      negative:
        file: "negative.txt"
        count: 1007
        usage: ["emotion_curve", "tension_composite"]

  tension:
    description: "叙事张力信号词表（战斗/冲突相关）"
    lexicons:
      action_terms:
        file: "combat.txt"
        count: ~67
        usage: ["tension_proxy", "rhythm_curve"]

  style:
    description: "语言风格维度词表"
    lexicons:
      sensory_5sense:
        file: "sensory.txt"
        count: ~137
        usage: ["chunk_style", "sensory_density"]
      semantic_10cat:
        file: "semantic_category.txt"
        count: ~500
        usage: ["chunk_style", "category_density"]
      function_words:
        file: "function_words.txt"
        count: ~200
        usage: ["chunk_style", "fw_distribution"]

  culture:
    description: "文化元素词表"
    lexicons:
      imagery:
        file: "imagery.txt"
        count: ~100
        usage: ["chunk_culture", "imagery_density"]
      idioms:
        file: "idioms.txt"
        count: ~300
        usage: ["idiom_density"]
      classical_imagery:
        file: "classical_imagery.txt"
        count: ~50
        usage: ["classical_density"]

  auxiliary:
    description: "辅助词表（停用词、专有名词等）"
    lexicons:
      stopwords:
        file: "stopwords.txt"
        count: ~2000
        usage: ["topic_preprocessor", "tokenize"]
      proper_nouns:
        file: "proper_nouns.txt"
        count: ~0
        usage: ["suggest_expand"]
      function_words_classical:
        file: "function_words_classical.txt"
        count: ~30
        usage: ["classical_sentence_ratio"]
      alias_keywords:
        file: "alias_keywords.txt"
        count: ~100
        usage: ["entity_disambiguation"]
      disambig_protected:
        file: "disambig_protected.txt"
        count: ~50
        usage: ["entity_disambiguation"]

  domain:
    description: "领域扩展词表（按小说类型/题材分类）"
    lexicons:
      xianxia_positive:
        file: "domain/xianxia_positive.txt"
        count: 63
        usage: ["emotion_curve", "domain_xianxia"]
      xianxia_negative:
        file: "domain/xianxia_negative.txt"
        count: 69
        usage: ["emotion_curve", "domain_xianxia"]
      shuwen_pattern:
        file: "domain/shuwen_pattern.txt"
        count: 65
        usage: ["emotion_curve", "domain_shuwen"]
      power_struggle:
        file: "domain/power_struggle.txt"
        count: 68
        usage: ["tension_proxy", "domain_power"]
      urban_positive:
        file: "domain/urban_positive.txt"
        count: 84
        usage: ["emotion_curve", "domain_urban"]
      urban_negative:
        file: "domain/urban_negative.txt"
        count: 82
        usage: ["emotion_curve", "domain_urban"]
      scifi_terms:
        file: "domain/scifi_terms.txt"
        count: 49
        usage: ["domain_scifi"]
      historical_terms:
        file: "domain/historical_terms.txt"
        count: 55
        usage: ["domain_historical"]
      mystery_terms:
        file: "domain/mystery_terms.txt"
        count: 45
        usage: ["domain_mystery"]
