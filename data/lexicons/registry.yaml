# 词表注册中心 (Lexicon Registry v3)
#
# 表目标识即文件名（data/lexicons/ 下无语义 key 层），每个表目登记元数据：
# kind / status / weight_policy / consumers。
# 约束取舍（2026-08-15 按用户要求）：
#   - 加载报错保留（fail-fast）：registry.yaml 缺失、注册词表文件缺失 -> 加载即报错，
#     防止分析链静默拿到空词表降级
#   - 内容与声明类校验宽容：版本号不符 / 非法元数据（kind/status/weight_policy）-> warning + 空结果/默认值，
#     词表与注册表可自由迭代；count/file_hash 声明校验已删除
#   - version_hash 与加载状态无关：覆盖 registry.yaml + conflict_matrix.yaml + 全部注册文件原文
#   - consumers 登记真实消费点；新增词表建议同步登记（测试侧校验登记完整性）
#
# 2026-08-15 v3：取消 layers 分层与语义 key，表目即文件名。
# 删除 13 个词表资产：domain/ 9 表、idioms、classical_imagery、
# function_words_classical、alias_keywords、disambig_protected、proper_nouns
# （留存审定依据与实测利用率见 docs/词表体系重设计-修订版实施计划.md §0.2）。
# 情感词表按 L1 核心 / L2 口语分层（M3 重建并登记为独立表目；权重弃用，命中计数）。

version: "3.0"

lexicons:
  # ===== 情感（生产：段落链 positive/negative_weight_sum，命中计数） =====
  positive.txt:
    kind: emotion
    tier: L1
    polarity: positive
    status: active
    weight_policy: count   # M3 重建后为纯词条格式，命中计数
    consumers: ["workflows.preprocess_helpers", "metrics.paragraph_metrics"]
    description: "L1 核心正面情绪词（M3 重建：1061 词审定收敛至 98 词）"

  negative.txt:
    kind: emotion
    tier: L1
    polarity: negative
    status: active
    weight_policy: count
    consumers: ["workflows.preprocess_helpers", "metrics.paragraph_metrics"]
    description: "L1 核心负面情绪词（M3 重建：1007 词审定收敛至 158 词）"

  colloquial_positive.txt:
    kind: emotion
    tier: L2
    polarity: positive
    status: active
    weight_policy: count
    consumers: ["workflows.preprocess_helpers", "metrics.paragraph_metrics"]
    description: "L2 网文口语正面情绪词（与 positive.txt 合并消费）"

  colloquial_negative.txt:
    kind: emotion
    tier: L2
    polarity: negative
    status: active
    weight_policy: count
    consumers: ["workflows.preprocess_helpers", "metrics.paragraph_metrics"]
    description: "L2 网文口语负面情绪词（与 negative.txt 合并消费）"

  # ===== 张力（生产：段落链 fight_weight_sum） =====
  combat.txt:
    kind: tension
    status: active
    weight_policy: uniform
    consumers: ["workflows.preprocess_helpers", "metrics.paragraph_metrics"]
    description: "战斗/冲突信号词"

  # ===== 风格（生产：段落链 sensory_hit_count / function_word_counts / semantic_category_counts / imagery_hit_count） =====
  sensory.txt:
    kind: style
    status: active
    weight_policy: uniform
    consumers: ["workflows.preprocess_helpers", "metrics.paragraph_metrics"]
    description: "五感感官词"

  semantic_category.txt:
    kind: style
    status: active
    weight_policy: uniform
    consumers: ["workflows.preprocess_helpers", "metrics.paragraph_metrics"]
    description: "语义类别词表（类别标题解析见 style_metrics.parse_semantic_category_lexicon）"

  function_words.txt:
    kind: style
    status: active
    weight_policy: uniform
    consumers: ["workflows.preprocess_helpers", "metrics.paragraph_metrics"]
    description: "虚词表"

  imagery.txt:
    kind: style
    status: active
    weight_policy: uniform
    consumers: ["workflows.preprocess_helpers", "metrics.paragraph_metrics"]
    description: "意象词（原 culture.imagery 随 culture 层删除归位 style；仅段落链 imagery_hit_count 消费）"

  # ===== tokenizer 类 =====
  stopwords.txt:
    kind: tokenizer
    status: active
    weight_policy: uniform
    consumers: ["topic.preprocessor"]
    description: "停用词"

  jieba_user_dict.txt:
    kind: tokenizer
    status: active
    weight_policy: uniform
    consumers: ["preprocess.tokenize"]
    description: "jieba 用户词典（v3 补注册）"

  negation_words.txt:
    kind: tokenizer
    status: active
    weight_policy: uniform
    consumers: ["metrics.negation"]
    description: "否定词表（M5 重写为 hard/modal/double 分类，由 src.metrics.negation 消费）"
