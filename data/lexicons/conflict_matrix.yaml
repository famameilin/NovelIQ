# 跨表冲突声明 (Cross-Lexicon Conflict Matrix)
#
# 明确标注哪些词条被多个词表引用（跨表重叠）。
# 每个条目声明:
#   - term: 词条文本
#   - primary: 主属表 (file 名格式，如 semantic_category.txt)
#   - referenced_by: 被哪些其他表引用
#   - note: 重叠原因说明
#
# 使用场景:
#   1. 加载词表时可选择 exclude_borrowed=True 排除借用词
#   2. 审计/报告时标注重复计数来源
#   3. 去重脚本参考依据
#
# 创建时间: 2026-04-06 | 分支: fix/timeline-multi-peak

