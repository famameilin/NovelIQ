[project]
name = "novel-qa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.0",
    "networkx>=3.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "openai>=1.0.0",
    "litellm>=1.63.0",
    "pydantic>=2.0.0",
    "pgvector>=0.4.2",
    "jieba>=0.42.1",
    "streamingjson>=0.0.5",
    "tiktoken>=0.7.0",
    "json5>=0.9.0",
    "gensim>=4.3.2",
    "numpy>=1.24.0",
    "pyahocorasick>=2.0.0",
    "sse-starlette>=2.0.0",
    "langgraph>=1.2.10",
    "langchain-core>=0.3,<2",
    "langchain-openai>=1.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-xdist>=3.6.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "types-pyyaml>=6.0.12.20260408",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

# 注: coverage 使用模块名 source（如 --cov=src.api.routes.sse）会注册模块级 import 钩子，
# 与 numpy 2.4 的扩展模块二次加载检查冲突（cannot load module more than once per process）。
# 请使用路径 source（--cov=src）或整包名。dev.ps1 test 已按路径模式接入。

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
exclude = '^scripts[\\/]run_api\.py$'
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["aiofiles.*"]
ignore_missing_imports = true
